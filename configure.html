<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hert's UK TV</title>
<link rel="icon" href="icon.svg">
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#181b22; --text:#eceef2; --muted:#9aa1ad; --accent:#7b5bf5; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border-radius:16px; padding:32px 24px; text-align:center; }
  img { width:84px; height:84px; border-radius:18px; }
  h1 { margin:16px 0 4px; font-size:1.5rem; }
  p { margin:0 0 16px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0 0 24px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  li { padding:4px 12px; border-radius:99px; background:#232733; font-size:.9rem; }
  a.btn { display:block; padding:14px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
  a.alt { display:inline-block; margin-top:16px; color:var(--muted); font-size:.9rem; }
  small { display:block; margin-top:20px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>Hert's UK TV</h1>
  <p>UK-made shows on the four UK streamers, sorted by genre and updated every week.</p>
  <ul><li>BBC iPlayer</li><li>ITVX</li><li>Channel 4</li><li>U&amp;Dave</li></ul>
  <a class="btn" id="install" href="#">Save to Stremio</a>
  <a class="alt" id="web" href="#">Install in Stremio Web instead</a>
  <small>Saving again replaces your installed copy, so this is also how you update it.</small>
</main>
<script>
  var manifest = new URL('manifest.json', location.href).href;
  document.getElementById('install').href = 'stremio://' + manifest.replace(/^https?:\/\//, '');
  document.getElementById('web').href = 'https://web.stremio.com/#/addons?addon=' + encodeURIComponent(manifest);
</script>
</body>
</html>
